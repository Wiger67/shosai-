[package]
name = "shosai-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# 手機版只拿來閱讀：不帶 Typst PDF 引擎（省下約 21 MB）
shosai = { path = "../shosai", default-features = false }

[package.metadata.android]
package = "app.shosai"
apk_name = "shosai"
build_targets = ["aarch64-linux-android"]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

# 讀取 Nextcloud 等其他 App 放在手機裡的檔案（要在系統設定裡允許「所有檔案存取權」，
# 書齋裡有按鈕直接打開那個設定頁）
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.application]
label = "書齋"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
# 入口是 java/ 裡的 ShosaiActivity（NativeActivity 再加上全螢幕與權限）。
# cargo apk 不會編 Java，要用 build.ps1 打包，否則一開啟就會因為找不到這個類別而結束
has_code = true

[package.metadata.android.application.activity]
name = "app.shosai.ShosaiActivity"
